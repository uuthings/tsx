name: TranslateX
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    macOS: '15.0'
  developmentLanguage: en
  createIntermediateGroups: true
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '15.0'
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    CODE_SIGN_STYLE: Automatic
    CLANG_WARN_DOCUMENTATION_COMMENTS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
targets:
  TranslateX:
    type: application
    platform: macOS
    productName: TSX
    sources:
      - path: TranslateX
    dependencies:
      - package: Sparkle
    postBuildScripts:
      - name: Embed Codex Runtime and Licenses
        script: '"$SRCROOT/Scripts/embed-codex-runtime.sh"'
        basedOnDependencyAnalysis: false
        inputFiles:
          - $(SRCROOT)/.build/CodexRuntime/package/$(CONFIGURATION)/package-manifest.json
          - $(SRCROOT)/LICENSE
          - $(SRCROOT)/THIRD_PARTY_NOTICES.md
          - $(SRCROOT)/Config/Licenses/Sparkle-LICENSE.txt
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Helpers/translatex-codex-runtime
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/CodexThirdPartyNotices.txt
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/TSX-LICENSE.txt
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/TSX-ThirdPartyNotices.md
          - $(TARGET_BUILD_DIR)/$(CONTENTS_FOLDER_PATH)/Resources/Sparkle-LICENSE.txt
    settings:
      base:
        TRANSLATEX_APP_BUNDLE_IDENTIFIER: com.lumax.tsx
        PRODUCT_BUNDLE_IDENTIFIER: $(TRANSLATEX_APP_BUNDLE_IDENTIFIER)
        DEVELOPMENT_TEAM: 97K37J92QD
        MARKETING_VERSION: 1.3.9
        CURRENT_PROJECT_VERSION: 18
        PRODUCT_MODULE_NAME: TranslateX
        SWIFT_OBJC_BRIDGING_HEADER: TranslateX/System/Security/KeychainInteraction.h
        PRODUCT_NAME: TSX
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_DEBUG_DYLIB: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) TRANSLATEX_DIRECT
        OTHER_CODE_SIGN_FLAGS: $(inherited) --options runtime
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: TSX
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        CODE_SIGN_ENTITLEMENTS: Config/TranslateX.entitlements
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  TranslateXTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TranslateXTests
    dependencies:
      - target: TranslateX
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lumax.tsx.Tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TranslateX:
    build:
      targets:
        TranslateX: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TranslateXTests
      gatherCoverageData: false
    archive:
      config: Release
      customArchiveName: TSX
